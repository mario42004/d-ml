services:
  vibration-dats-api:
    image: ${VIBRATION_DATS_IMAGE:-ghcr.io/mario42004/d-ml-vibration-dats-api:latest}
    pull_policy: always
    container_name: vibration-dats-api
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      APP_ENV: production
      APP_PORT: 8002
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-25}
      MAX_CAPTURE_DURATION_SECONDS: ${MAX_CAPTURE_DURATION_SECONDS:-180}
      DEFAULT_WINDOW_MS: ${DEFAULT_WINDOW_MS:-500}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
