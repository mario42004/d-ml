name: Vibration DATS API CI

on:
  push:
    paths:
      - ".github/workflows/vibration-dats-api-ci.yml"
      - "vibration_dats_api/**"
  pull_request:
    paths:
      - ".github/workflows/vibration-dats-api-ci.yml"
      - "vibration_dats_api/**"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mario42004/d-ml-vibration-dats-api

jobs:
  test:
    name: Test vibration DATS API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibration_dats_api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vibration_dats_api/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile Python modules
        run: python -m py_compile app/main.py app/routers/*.py app/services/*.py app/core/*.py

      - name: Run tests
        run: PYTHONPATH=. pytest -q

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: vibration_dats_api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t vibration-dats-api:ci .

  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs:
      - test
      - docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: vibration_dats_api
          file: vibration_dats_api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
